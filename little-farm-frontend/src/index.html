<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Little Farm</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			#cells {
				display: grid;
				grid-template-rows: repeat(8, 64px);
				grid-template-columns: repeat(8, 64px);
			}

			#cells > div {
				transition: 0.15s;
			}

			#cells > div:hover {
				filter: brightness(1.3);
			}

			#cells > div > div {
				display: grid;
				grid-template-rows: repeat(16, 4px);
				grid-template-columns: repeat(16, 4px);
			}

			#cells > div > div.active {
				cursor: pointer;
			}

			#cells > div > div.disabled {
				cursor: not-allowed;
			}
		</style>
	</head>
	<body>
		<div id="cells"></div>
		<div id="resources">
			<div>
				<span>Corn:</span>
				<span id="resource__corn">0</span>
			</div>
			<div>
				<span>Seeds:</span>
				<span id="resource__seeds">0</span>
			</div>
			<div>
				<span>Money:</span>
				<span id="resource__money">0.00</span>
			</div>
		</div>
		<div id="planting-menu"></div>
	</body>
</html>
